<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Network &amp; Log Dashboard</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header>
  <h1>Network &amp; Log Dashboard</h1>
  <span id="updated">loading...</span>
</header>
<main>
  <section class="cards">
    <div class="card"><span id="c-total">0</span><small>Total events</small></div>
    <div class="card info"><span id="c-info">0</span><small>Info</small></div>
    <div class="card warn"><span id="c-warning">0</span><small>Warnings</small></div>
    <div class="card err"><span id="c-error">0</span><small>Errors</small></div>
    <div class="card"><span id="c-ips">0</span><small>Unique IPs</small></div>
  </section>

  <section>
    <h2>Events per hour</h2>
    <div id="chart" class="chart"></div>
  </section>

  <section>
    <h2>Top suspicious IPs</h2>
    <table id="top-ips"><thead><tr><th>IP</th><th>Warnings + errors</th></tr></thead><tbody></tbody></table>
  </section>

  <section>
    <h2>Recent events</h2>
    <label>Level
      <select id="level">
        <option value="">All</option>
        <option>INFO</option>
        <option>WARNING</option>
        <option>ERROR</option>
      </select>
    </label>
    <div class="scroll">
      <table id="events"><thead><tr><th>Time</th><th>Level</th><th>Service</th><th>IP</th><th>Message</th></tr></thead><tbody></tbody></table>
    </div>
  </section>
</main>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
